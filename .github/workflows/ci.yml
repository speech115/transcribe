name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Push and pull_request runs use distinct refs and check names. This preserves
# pre-PR branch CI without creating two required "test" checks for one SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && 'test' || 'branch-test' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -q

  # macOS is a first-class target (the vendored engine is arm64 macOS);
  # the suite itself is pure-stdlib and runs anywhere.
  test-macos:
    name: test-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: pip install . pytest
      - name: Verify installed runtime
        run: |
          transcribe --help
          python -c 'import os; from transcribe.run import FLUID; assert FLUID.exists() and os.access(FLUID, os.X_OK), FLUID'
      - name: Verify wheel architecture
        run: |
          python -m pip wheel --no-deps . -w /tmp/transcribe-wheel
          wheel=$(find /tmp/transcribe-wheel -name '*.whl' -print -quit)
          case "$wheel" in
            *-py3-none-macosx_*_arm64.whl) ;;
            *) echo "unexpected wheel: $wheel"; exit 1 ;;
          esac
      - name: Run tests
        run: python -m pytest tests/ -q
