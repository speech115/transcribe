<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">transcribe</title>
  <desc id="desc">Local offline transcription with speaker diarization — light theme banner</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbfd"/>
      <stop offset="100%" stop-color="#e9f1f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 19px; }
      .fg { fill: #0d1c26; }
      .muted { fill: #55707f; }
      .dim { fill: #8aa3b1; }
      .str { fill: #157a49; }
    </style>
  </defs>

  <rect width="1280" height="460" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

  <g transform="translate(72,64)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#accent)"/>
    <g transform="scale(2.8)" fill="#ffffff">
      <path d="M17.919 9.335c.367 0 .665.298.665.665v1.296a.665.665 0 0 1-1.33 0v-.631H15.25v5.337h.585l.135.014a.665.665 0 0 1 0 1.302l-.135.014h-2.5a.666.666 0 0 1 0-1.33h.585v-5.337h-2.003v.63a.665.665 0 0 1-1.33 0V10c0-.367.298-.665.665-.665h6.667Zm-12.5-6.667c.367 0 .665.298.665.665v10a.665.665 0 0 1-1.33 0v-10c0-.367.298-.665.665-.665Zm2.916 2.5c.367 0 .665.298.665.665v5a.665.665 0 0 1-1.33 0v-5c0-.367.298-.665.665-.665ZM2.502 6.835c.367 0 .665.298.665.665v1.666a.665.665 0 0 1-1.33 0V7.5c0-.367.298-.665.665-.665Zm8.75-3.334c.367 0 .665.298.665.665v2.917a.665.665 0 0 1-1.33 0V4.166c0-.367.298-.665.665-.665Z"/>
    </g>
    <text class="sans fg" x="76" y="30" font-size="38" font-weight="700">transcribe</text>
    <text class="sans muted" x="76" y="56" font-size="17">Local offline transcription with speaker diarization &#183; no cloud, no uploads</text>
  </g>

  <g transform="translate(72,168)">
    <rect x="0" y="0" width="1136" height="212" rx="14" fill="#ffffff" stroke="#cfe0ea"/>
    <circle cx="26" cy="26" r="6" fill="#d6e4ec"/>
    <circle cx="46" cy="26" r="6" fill="#d6e4ec"/>
    <circle cx="66" cy="26" r="6" fill="#d6e4ec"/>
    <line x1="0" y1="52" x2="1136" y2="52" stroke="#e4eef3"/>
    <g class="mono">
      <text x="28" y="90"><tspan class="dim">$</tspan> <tspan class="fg">transcribe call.m4a --speakers auto</tspan></text>
      <text x="28" y="124"><tspan class="dim">$</tspan> <tspan class="fg">transcribe </tspan><tspan class="str">"https://www.youtube.com/watch?v=…"</tspan><tspan class="fg"> --speakers auto</tspan></text>
      <text x="28" y="158"><tspan class="dim">$</tspan> <tspan class="fg">transcribe status --json</tspan></text>
      <text x="28" y="192"><tspan class="str">✓ готово · 3 спикер(ов) · 12:34 · ASR 61x · ru</tspan><tspan class="dim">   # transcript.md + transcript.json + manifest.json</tspan></text>
    </g>
  </g>

  <text class="sans muted" x="72" y="416" font-size="15">100% local after model cache<tspan class="dim">&#160;&#160;&#183;&#160;&#160;</tspan>FluidAudio Parakeet TDT v3 + diarization<tspan class="dim">&#160;&#160;&#183;&#160;&#160;</tspan>local files &amp; YouTube<tspan class="dim">&#160;&#160;&#183;&#160;&#160;</tspan>macOS Apple Silicon</text>
</svg>
